<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CashaLot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app" class="app" data-screen-label="CashaLot Dashboard">
      <div class="header" :style="enterStyle(0)">
        <div>
          <div class="title">CashaLot</div>
          <div class="subtitle">Income, expenses & savings · saved on this device</div>
        </div>
        <div class="header-actions">
          <span class="status-message" v-if="statusMessage">{{ statusMessage }}</span>
          <button class="btn-reset" @click="exportData">Export</button>
          <button class="btn-reset" @click="triggerImport">Import</button>
          <input
            ref="fileInputRef"
            type="file"
            accept="application/json"
            @change="importData"
            style="display: none"
            aria-label="Import a JSON data file"
          />
          <button class="btn-reset" @click="resetSeed">Reset example</button>
          <div class="segmented">
            <div
              class="segmented-pill"
              :style="{ transform: state.view === 'cards' ? 'translateX(0)' : 'translateX(100%)' }"
            ></div>
            <button
              class="segmented-btn"
              :style="{ color: state.view === 'cards' ? '#0d1117' : '#8b949e' }"
              @click="state.view = 'cards'"
            >
              Cards
            </button>
            <button
              class="segmented-btn"
              :style="{ color: state.view === 'compact' ? '#0d1117' : '#8b949e' }"
              @click="state.view = 'compact'"
            >
              Compact
            </button>
          </div>
        </div>
      </div>

      <!-- ===================== CARDS ===================== -->
      <template v-if="state.view === 'cards'">
        <div :style="enterStyle(60)">
          <div class="hero-card">
            <div class="hero-label">Left over each month</div>
            <div class="hero-number" :style="{ color: remainingColor }">{{ fmt(anim.remainingAfterSavings) }}</div>
            <div class="hero-sub">
              ≈ {{ fmt(totals.smoothedRemaining) }} smoothing annual and quarterly charges over 12 months
            </div>
          </div>
        </div>

        <div :style="enterStyle(120)">
          <div class="stats-row">
            <div class="stat-card">
              <div class="stat-head">
                <span class="dot" style="background: #3fb950"></span><span class="stat-label">Income</span>
              </div>
              <div class="stat-number">{{ fmt(anim.totalIn) }}</div>
            </div>
            <div class="stat-card">
              <div class="stat-head">
                <span class="dot" style="background: #58a6ff"></span><span class="stat-label">Fixed expenses</span>
              </div>
              <div class="stat-number">{{ fmt(anim.totalOut) }}</div>
            </div>
            <div class="stat-card">
              <div class="stat-head">
                <span class="dot" style="background: #8b949e"></span><span class="stat-label">Savings</span>
              </div>
              <div class="stat-number">{{ fmt(anim.totalSavings) }}</div>
            </div>
          </div>
        </div>

        <div :style="enterStyle(170)">
          <div class="donuts-row">
            <div class="donut-card">
              <div class="donut-title">
                Smoothed
                <span class="donut-title-sub">· annual &amp; quarterly charges spread over 12 months</span>
              </div>
              <div class="donut-body">
                <div class="donut-ring-wrap">
                  <div class="donut-ring" :style="{ background: donutGradient }"></div>
                  <div class="donut-center">
                    <div class="donut-center-num">{{ fmt(chartTotal) }}</div>
                    <div class="donut-center-label">per month</div>
                  </div>
                </div>
                <div class="donut-legend">
                  <div class="legend-row" v-for="seg in segments" :key="seg.key">
                    <span class="dot" :style="{ background: seg.color }"></span>
                    <span class="legend-label">{{ seg.label }}</span>
                    <span class="legend-pct">{{ seg.pct }}%</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="donut-card">
              <div class="donut-title">Unsmoothed <span class="donut-title-sub">· expenses &amp; loans only</span></div>
              <div class="donut-body">
                <div class="donut-ring-wrap">
                  <div class="donut-ring" :style="{ background: donutGradientFixed }"></div>
                  <div class="donut-center">
                    <div class="donut-center-num">{{ fmt(totals.totalOut) }}</div>
                    <div class="donut-center-label">per month</div>
                  </div>
                </div>
                <div class="donut-legend">
                  <div class="legend-row" v-for="seg in segmentsFixed" :key="seg.key">
                    <span class="dot" :style="{ background: seg.color }"></span>
                    <span class="legend-label">{{ seg.label }}</span>
                    <span class="legend-pct">{{ seg.pct }}%</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="categories-grid">
          <div :style="enterStyle(210)">
            <div class="category-card">
              <div class="category-head">
                <div class="category-name">Income</div>
                <div class="category-total" style="color: #3fb950">{{ fmt(anim.totalIn) }}</div>
              </div>
              <div class="rows">
                <div class="row row--simple" v-for="item in state.income" :key="item.id">
                  <input class="input-text" v-model.lazy="item.label" aria-label="Income label" />
                  <input
                    class="input-amount"
                    type="number"
                    v-model.lazy.number="item.amount"
                    aria-label="Income amount in euros"
                  />
                  <input
                    class="input-day"
                    type="number"
                    v-model.lazy="item.day"
                    placeholder="day"
                    aria-label="Payment day"
                  />
                  <button class="btn-delete" @click="deleteRow('income', item.id)" aria-label="Delete this income">
                    ×
                  </button>
                </div>
              </div>
              <button class="btn-add btn-add--green" @click="addIncome">+ Add income</button>
            </div>
          </div>

          <div :style="enterStyle(240)">
            <div class="category-card">
              <div class="category-head">
                <div class="category-name">Expenses</div>
                <div class="category-total" style="color: #58a6ff">{{ fmt(totals.totalRecurring) }}</div>
              </div>
              <div class="rows">
                <div class="row row--simple" v-for="item in state.recurring" :key="item.id">
                  <input class="input-text" v-model.lazy="item.label" aria-label="Expense label" />
                  <input
                    class="input-amount"
                    type="number"
                    v-model.lazy.number="item.amount"
                    aria-label="Expense amount in euros"
                  />
                  <input
                    class="input-day"
                    type="number"
                    v-model.lazy="item.day"
                    placeholder="day"
                    aria-label="Debit day"
                  />
                  <button class="btn-delete" @click="deleteRow('recurring', item.id)" aria-label="Delete this expense">
                    ×
                  </button>
                </div>
              </div>
              <button class="btn-add btn-add--blue" @click="addRecurring">+ Add expense</button>
            </div>
          </div>

          <div :style="enterStyle(270)">
            <div class="category-card">
              <div class="category-head">
                <div class="category-name">Loans</div>
                <div class="category-total" style="color: #a371f7">{{ fmt(totals.totalLoans) }}</div>
              </div>
              <div class="rows" style="gap: 10px">
                <div class="loan-row" v-for="item in state.loans" :key="item.id">
                  <div class="loan-row-top">
                    <input class="input-text" v-model.lazy="item.label" aria-label="Loan label" />
                    <input
                      class="input-amount"
                      type="number"
                      v-model.lazy.number="item.amount"
                      aria-label="Loan monthly payment in euros"
                    />
                    <button class="btn-delete" @click="deleteRow('loans', item.id)" aria-label="Delete this loan">
                      ×
                    </button>
                  </div>
                  <div class="loan-progress-line">
                    <div class="progress-track">
                      <div class="progress-fill" :style="{ width: loanProgressPct(item) + '%' }"></div>
                    </div>
                    <div class="progress-label">{{ loanProgressLabel(item) }}</div>
                  </div>
                  <div class="loan-meta">
                    <label
                      >Duration
                      <input
                        type="number"
                        v-model.lazy.number="item.totalMonths"
                        aria-label="Loan duration in months"
                      />
                      months
                    </label>
                    <label
                      >End
                      <input type="date" v-model.lazy="item.endDate" aria-label="Loan end date" />
                    </label>
                  </div>
                </div>
              </div>
              <button class="btn-add btn-add--purple" @click="addLoan">+ Add loan</button>
            </div>
          </div>

          <div :style="enterStyle(300)">
            <div class="category-card">
              <div class="category-head">
                <div class="category-name">One-off expenses</div>
                <div class="category-total" style="color: #39c5cf">
                  {{ fmt(totals.totalOneOff) }}<span class="category-total-suffix">/yr</span>
                </div>
              </div>
              <div class="rows">
                <div class="row row--one-off" v-for="item in state.oneOff" :key="item.id">
                  <input class="input-text" v-model.lazy="item.label" aria-label="One-off expense label" />
                  <input
                    class="input-amount"
                    type="number"
                    v-model.lazy.number="item.amount"
                    aria-label="One-off expense amount in euros"
                  />
                  <select class="select-month" v-model.lazy="item.month" aria-label="One-off expense month">
                    <option v-for="m in MONTHS" :key="m" :value="m">{{ m }}</option>
                  </select>
                  <button
                    class="btn-delete"
                    @click="deleteRow('oneOff', item.id)"
                    aria-label="Delete this one-off expense"
                  >
                    ×
                  </button>
                </div>
              </div>
              <button class="btn-add btn-add--cyan" @click="addOneOff">+ Add</button>
            </div>
          </div>

          <div :style="enterStyle(330)">
            <div class="category-card">
              <div class="category-head">
                <div class="category-name">Quarterly charges</div>
                <div class="category-total" style="color: #545d7a">
                  {{ fmt(totals.totalQuarterly) }}<span class="category-total-suffix">/yr</span>
                </div>
              </div>
              <div class="rows">
                <div class="row row--quarterly" v-for="item in state.quarterly" :key="item.id">
                  <input class="input-text" v-model.lazy="item.label" aria-label="Quarterly charge label" />
                  <input
                    class="input-amount"
                    type="number"
                    v-model.lazy.number="item.amount"
                    aria-label="Charge amount in euros"
                  />
                  <input
                    class="input-boxed"
                    type="number"
                    v-model.lazy.number="item.occurrences"
                    title="times per year"
                    aria-label="Number of occurrences per year"
                  />
                  <input
                    class="input-note"
                    v-model.lazy="item.monthsLabel"
                    placeholder="months"
                    aria-label="Months concerned"
                  />
                  <button class="btn-delete" @click="deleteRow('quarterly', item.id)" aria-label="Delete this charge">
                    ×
                  </button>
                </div>
              </div>
              <button class="btn-add btn-add--slate" @click="addQuarterly">+ Add</button>
            </div>
          </div>

          <div :style="enterStyle(360)">
            <div class="category-card">
              <div class="category-head">
                <div class="category-name">Savings</div>
                <div class="category-total" style="color: #8b949e">{{ fmt(anim.totalSavings) }}</div>
              </div>
              <div class="empty-state" v-if="state.savings.length === 0">Nothing set aside yet.</div>
              <div class="rows">
                <div class="row row--savings" v-for="item in state.savings" :key="item.id">
                  <input class="input-text" v-model.lazy="item.label" aria-label="Savings label" />
                  <input
                    class="input-amount"
                    type="number"
                    v-model.lazy.number="item.amount"
                    aria-label="Savings amount in euros"
                  />
                  <button
                    class="btn-delete"
                    @click="deleteRow('savings', item.id)"
                    aria-label="Delete this savings entry"
                  >
                    ×
                  </button>
                </div>
              </div>
              <button class="btn-add btn-add--muted" @click="addSavings">+ Add</button>
            </div>
          </div>
        </div>
      </template>

      <!-- ===================== COMPACT ===================== -->
      <template v-if="state.view === 'compact'">
        <div class="compact">
          <div class="compact-strip">
            <div>
              <span class="compact-strip-label">Income </span
              ><span class="compact-strip-value" style="color: #3fb950">{{ fmt(totals.totalIn) }}</span>
            </div>
            <div>
              <span class="compact-strip-label">Expenses </span
              ><span class="compact-strip-value" style="color: #58a6ff">{{ fmt(totals.totalOut) }}</span>
            </div>
            <div>
              <span class="compact-strip-label">Left </span
              ><span class="compact-strip-value" :style="{ color: remainingColor }"
                >{{ fmt(totals.remainingAfterSavings) }}</span
              >
            </div>
            <div class="compact-strip-note">smoothed ≈ {{ fmt(totals.smoothedRemaining) }}</div>
          </div>

          <div class="compact-bar">
            <div v-for="seg in segments" :key="seg.key" :style="{ width: seg.pct + '%', background: seg.color }"></div>
          </div>

          <div class="compact-sections">
            <div>
              <div class="compact-section-head">
                Income<span style="color: #3fb950">{{ fmt(totals.totalIn) }}</span>
              </div>
              <div class="compact-row compact-row--simple" v-for="item in state.income" :key="item.id">
                <input class="input-text" v-model.lazy="item.label" aria-label="Income label" />
                <input
                  class="input-amount"
                  type="number"
                  v-model.lazy.number="item.amount"
                  aria-label="Income amount in euros"
                />
                <input
                  class="input-day"
                  type="number"
                  v-model.lazy="item.day"
                  placeholder="d."
                  aria-label="Payment day"
                />
                <button class="btn-delete-sm" @click="deleteRow('income', item.id)" aria-label="Delete this income">
                  ×
                </button>
              </div>
              <button class="btn-add-sm" @click="addIncome">+ add</button>
            </div>

            <div>
              <div class="compact-section-head">
                Expenses<span style="color: #58a6ff">{{ fmt(totals.totalRecurring) }}</span>
              </div>
              <div class="compact-row compact-row--simple" v-for="item in state.recurring" :key="item.id">
                <input class="input-text" v-model.lazy="item.label" aria-label="Expense label" />
                <input
                  class="input-amount"
                  type="number"
                  v-model.lazy.number="item.amount"
                  aria-label="Expense amount in euros"
                />
                <input
                  class="input-day"
                  type="number"
                  v-model.lazy="item.day"
                  placeholder="d."
                  aria-label="Debit day"
                />
                <button class="btn-delete-sm" @click="deleteRow('recurring', item.id)" aria-label="Delete this expense">
                  ×
                </button>
              </div>
              <button class="btn-add-sm" @click="addRecurring">+ add</button>
            </div>

            <div>
              <div class="compact-section-head">
                Loans<span style="color: #a371f7">{{ fmt(totals.totalLoans) }}</span>
              </div>
              <div class="compact-loan-row" v-for="item in state.loans" :key="item.id">
                <div class="compact-loan-top">
                  <input class="input-text" v-model.lazy="item.label" aria-label="Loan label" />
                  <input
                    class="input-amount"
                    type="number"
                    v-model.lazy.number="item.amount"
                    aria-label="Loan monthly payment in euros"
                  />
                  <button class="btn-delete-sm" @click="deleteRow('loans', item.id)" aria-label="Delete this loan">
                    ×
                  </button>
                </div>
                <div class="compact-progress-line">
                  <div class="progress-track">
                    <div class="progress-fill" :style="{ width: loanProgressPct(item) + '%' }"></div>
                  </div>
                  <div class="progress-label">{{ loanProgressLabel(item) }}</div>
                </div>
              </div>
              <button class="btn-add-sm" @click="addLoan">+ add</button>
            </div>

            <div>
              <div class="compact-section-head">
                One-off<span style="color: #39c5cf">{{ fmt(totals.totalOneOff) }}/yr</span>
              </div>
              <div class="compact-row compact-row--one-off" v-for="item in state.oneOff" :key="item.id">
                <input class="input-text" v-model.lazy="item.label" aria-label="One-off expense label" />
                <input
                  class="input-amount"
                  type="number"
                  v-model.lazy.number="item.amount"
                  aria-label="One-off expense amount in euros"
                />
                <select class="select-month" v-model.lazy="item.month" aria-label="One-off expense month">
                  <option v-for="m in MONTHS" :key="m" :value="m">{{ m }}</option>
                </select>
                <button
                  class="btn-delete-sm"
                  @click="deleteRow('oneOff', item.id)"
                  aria-label="Delete this one-off expense"
                >
                  ×
                </button>
              </div>
              <button class="btn-add-sm" @click="addOneOff">+ add</button>
            </div>

            <div>
              <div class="compact-section-head">
                Quarterly<span style="color: #545d7a">{{ fmt(totals.totalQuarterly) }}/yr</span>
              </div>
              <div class="compact-row compact-row--quarterly" v-for="item in state.quarterly" :key="item.id">
                <input class="input-text" v-model.lazy="item.label" aria-label="Quarterly charge label" />
                <input
                  class="input-amount"
                  type="number"
                  v-model.lazy.number="item.amount"
                  aria-label="Charge amount in euros"
                />
                <input
                  class="input-boxed"
                  type="number"
                  v-model.lazy.number="item.occurrences"
                  aria-label="Number of occurrences per year"
                />
                <input class="input-note" v-model.lazy="item.monthsLabel" aria-label="Months concerned" />
                <button class="btn-delete-sm" @click="deleteRow('quarterly', item.id)" aria-label="Delete this charge">
                  ×
                </button>
              </div>
              <button class="btn-add-sm" @click="addQuarterly">+ add</button>
            </div>

            <div>
              <div class="compact-section-head">
                Savings<span style="color: #8b949e">{{ fmt(totals.totalSavings) }}</span>
              </div>
              <div class="compact-row compact-row--savings" v-for="item in state.savings" :key="item.id">
                <input class="input-text" v-model.lazy="item.label" aria-label="Savings label" />
                <input
                  class="input-amount"
                  type="number"
                  v-model.lazy.number="item.amount"
                  aria-label="Savings amount in euros"
                />
                <button
                  class="btn-delete-sm"
                  @click="deleteRow('savings', item.id)"
                  aria-label="Delete this savings entry"
                >
                  ×
                </button>
              </div>
              <button class="btn-add-sm" @click="addSavings">+ add</button>
            </div>
          </div>
        </div>
      </template>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
